baseURL = "https://sondos.click/"
title = "Sondos Clicks"
enableRobotsTXT = true
defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false

[languages]
  [languages.es]
    locale = "es"
    label = "ES"
    weight = 1
    [languages.es.params]
      displayName = "ES"
  [languages.en]
    locale = "en"
    label = "EN"
    weight = 2
    [languages.en.params]
      displayName = "EN"

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v3"
  [[module.imports]]
    path = "github.com/divinerites/plausible-hugo"
